<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 280px; padding: 16px; font-family: system-ui; margin: 0; background: #f8fafc; }
        h1 { font-size: 18px; margin: 0 0 4px; color: #dc2626; }
        .status { padding: 10px; border-radius: 8px; margin: 12px 0; text-align: center; }
        .online { background: #dcfce7; color: #166534; }
        .offline { background: #fee2e2; color: #991b1b; }
        .stats { background: white; padding: 12px; border-radius: 8px; margin: 12px 0; border: 1px solid #e2e8f0; }
        .stat-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 13px; }
        button { width: 100%; padding: 8px; margin: 4px 0; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .footer { text-align: center; margin-top: 12px; font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>
    <h1>🧠 MindMirror Pro</h1>
    <div id="status" class="status">Checking...</div>
    <div class="stats" id="stats">Loading...</div>
    <button id="refreshBtn" class="btn-secondary">🔄 Refresh</button>
    <button id="dashboardBtn" class="btn-primary">📊 Dashboard</button>
    <div class="footer">Privacy-first | Local AI</div>
    <script src="popup.js"></script>
</body>
</html>
